[package]
name = "deskling"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
env_logger = "0.11.11"
gpui-kit = "0.8.0"
image = { version = "0.25.10", default-features = false }
raw-window-handle = "0.6.2"
log = "0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.31.4"

# Win32 calls used to keep the desktop widget on the desktop layer (also through Win+D).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The D3D11 debug layer on this machine is mismatched (0x887A002D), and GPUI
# requests it whenever debug assertions are on. Disable them for that crate only.
[profile.dev.package.gpui-pre-windows]
debug-assertions = false
